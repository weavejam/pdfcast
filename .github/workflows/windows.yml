name: Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release

      - name: Zip build output
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath pdfcast-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pdfcast-windows
          path: pdfcast-windows.zip
