name: pdfcast
description: "PDF 投屏：加载/接收 PDF，DLNA 投到电视，手机遥控翻页。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dlna_dart: ^0.1.1
  pdfrx: ^2.6.1
  file_picker: ^10.1.2
  wakelock_plus: ^1.4.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# dart run flutter_launcher_icons 重新生成各平台图标
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true # ASC 拒绝带 alpha 通道的 1024 图标（ITMS-90717）
  image_path: marketing/icon_raw.png
  windows:
    generate: true
    icon_size: 256
