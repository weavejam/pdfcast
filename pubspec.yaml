publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dlna_dart: ^0.1.1
  pdfrx: ^1.3.4
  file_picker: ^10.1.2
  wakelock_plus: ^1.4.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
